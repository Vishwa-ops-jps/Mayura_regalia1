# Render Blueprint for the MAYURA REGALIA React storefront and Express API.
# Create an external MySQL database first, then provide its credentials when
# Render prompts for the variables marked `sync: false`.
services:
  - type: web
    name: mayura-regalia-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "12669"

      - key: DB_USER
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_NAME
        value: defaultdb

      - key: DB_SSL
        value: "true"

      - key: DB_SSL_CA_PATH
        value: /etc/secrets/Aiven.pem

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false

  - type: web
    name: mayura-regalia-store
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build

    envVars:
      - key: REACT_APP_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
